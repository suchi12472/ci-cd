<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .employee {
            padding: 15px;
            margin: 10px 0;
            background: #f1f3f5;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <h2>Employees</h2>

    <div class="employee"
         th:each="employee : ${employees}"
         th:text="${employee}">
    </div>

</div>

</body>

</html>
